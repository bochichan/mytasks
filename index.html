<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>タスク</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
  --bg:#d7d1ba; --card:#ded8c2; --card2:#c4bfa5;
  --border:#a89b7a; --border-strong:#332f26;
  --text:#332f26; --sub:#5f5947; --on-dark:#f0ece0;
  --accent:#c97b52;
  --pa:#332f26; --pb:#5e5646; --pc:#8a8368; --pd:#a89b7a;
  --surface:#ded8c2; --surface2:#c4bfa5; --muted:#5f5947;
  --a:#c97b52; --a-dim:rgba(201,123,82,.15);
  --b:#a89b7a; --b-dim:rgba(168,155,122,.2);
  --c:#6b7a5e; --c-dim:rgba(107,122,94,.15);
  --d:#8a8368; --d-dim:rgba(138,131,104,.15);
  --single:#5f5947; --project:#332f26; --recur:#5e5646;
  --inbox:#332f26;
  --accent-dim:rgba(201,123,82,.15);
  --tab-h:60px; --header-h:56px; --filter-h:44px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; }
body {
  font-family:'Zen Kaku Gothic New',sans-serif;
  background:var(--bg);
  background-image:linear-gradient(rgba(51,47,38,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(51,47,38,.07) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--text); font-size:15px;
}
body::before {
  content:''; position:fixed;
  top:-35vw; right:-35vw; width:110vw; height:110vw;
  border:1px solid rgba(51,47,38,.05); border-radius:50%;
  pointer-events:none; z-index:0;
}

/* HEADER */
.header {
  position:fixed; top:0; left:0; right:0; height:var(--header-h);
  background:var(--border-strong); border-bottom:none;
  display:flex; align-items:center; padding:0 16px; gap:10px; z-index:10;
}
.header-title { flex:1; font-family:'Rajdhani','Zen Kaku Gothic New',sans-serif; font-size:22px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--on-dark); }
.sync-status { font-family:'JetBrains Mono',monospace; font-size:11px; color:rgba(240,236,224,.5); flex-shrink:0; }
.sync-status.ok { color:rgba(240,236,224,.9); } .sync-status.err { color:var(--accent); } .sync-status.busy { color:rgba(240,236,224,.6); }
.icon-btn {
  width:34px; height:34px; border-radius:2px; border:1px solid rgba(240,236,224,.25);
  background:none; color:var(--on-dark); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
}
.icon-btn:active { background:rgba(240,236,224,.12); }

/* FILTER BAR */
.filter-bar {
  position:fixed; top:var(--header-h); left:0; right:0; height:var(--filter-h);
  background:var(--card); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:8px; padding:0 14px;
  overflow-x:auto; scrollbar-width:none; z-index:9;
}
.filter-bar::-webkit-scrollbar { display:none; }
.hide-done-toggle { display:flex; align-items:center; gap:6px; flex-shrink:0; cursor:pointer; }
.toggle-track { width:36px; height:20px; border-radius:2px; background:var(--border); position:relative; transition:background .2s; flex-shrink:0; }
.toggle-track.on { background:var(--border-strong); }
.toggle-thumb { position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:1px; background:var(--on-dark); transition:left .2s; }
.toggle-track.on .toggle-thumb { left:18px; }
.toggle-label { font-size:11px; color:var(--sub); white-space:nowrap; font-family:'Rajdhani','Zen Kaku Gothic New',sans-serif; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }

/* CONTENT */
.content {
  position:fixed; top:calc(var(--header-h) + var(--filter-h)); left:0; right:0;
  bottom:calc(var(--tab-h) + var(--safe-bottom));
  overflow-y:auto; -webkit-overflow-scrolling:touch;
}
.content::-webkit-scrollbar { display:none; }

/* ══════════════════════════
   INBOX VIEW
══════════════════════════ */
.inbox-view { padding:10px 12px 24px; }

.inbox-quick {
  display:flex; gap:10px; align-items:center;
  background:var(--card); border:1px solid var(--border);
  border-radius:3px; padding:10px 12px; margin-bottom:10px;
}
.inbox-quick-input {
  flex:1; background:none; border:none; color:var(--text);
  font-family:'Zen Kaku Gothic New',sans-serif; font-size:15px; outline:none;
}
.inbox-quick-input::placeholder { color:var(--sub); }
.inbox-add-btn {
  width:32px; height:32px; border-radius:2px; background:var(--border-strong);
  border:none; color:var(--on-dark); font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  touch-action:manipulation;
}
.inbox-add-btn:active { opacity:.75; }

.inbox-section-label {
  font-family:'Rajdhani','Zen Kaku Gothic New',sans-serif; font-size:11px; color:var(--sub);
  letter-spacing:.15em; text-transform:uppercase; padding:0 4px; margin-bottom:6px; font-weight:700;
}

.inbox-card {
  background:var(--card); border:1px solid var(--border);
  border-left:3px solid var(--border-strong);
  border-radius:3px; margin-bottom:6px; overflow:hidden;
}
.inbox-card-header {
  display:flex; align-items:center; gap:10px; padding:10px 10px 10px 12px;
  cursor:pointer; touch-action:manipulation;
}
.inbox-card-title { flex:1; font-size:14px; line-height:1.4; word-break:break-all; }
.inbox-expand-icon { color:var(--sub); font-size:12px; flex-shrink:0; transition:transform .15s; }
.inbox-expand-icon.open { transform:rotate(180deg); }
.inbox-card-actions { display:flex; gap:4px; }
.inbox-act-btn {
  width:28px; height:28px; border-radius:2px; border:none;
  background:none; color:var(--sub); cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center; touch-action:manipulation;
}
.inbox-act-btn:active { background:var(--card2); }
.inbox-act-btn.clarify { color:var(--border-strong); font-weight:700; }
.inbox-act-btn.del { color:var(--border); }
.inbox-act-btn.del:active { color:var(--accent); }

.inbox-card-detail {
  padding:0 12px 10px; display:none; border-top:1px solid var(--border);
}
.inbox-card-detail.open { display:block; }

/* ══════════════════════════
   TREE VIEW
══════════════════════════ */
.tree-view { padding:10px 12px 24px; }

.tree-node {
  border-radius:3px; overflow:visible; border:1px solid var(--border);
  background:var(--card); margin-bottom:6px;
  transition:opacity .15s, box-shadow .15s;
}

.node-row { display:flex; align-items:center; gap:8px; padding:12px 10px 10px 10px; position:relative; overflow:hidden; border-radius:3px 3px 0 0; }
.node-bar { position:absolute; top:0; left:0; right:0; height:3px; }
.bar-a { background:var(--pa); } .bar-b { background:var(--pb); }
.bar-c { background:var(--pc); } .bar-d { background:var(--pd); }

.node-expand {
  width:22px; height:22px; border-radius:2px; border:none;
  background:var(--card2); color:var(--sub); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; flex-shrink:0; touch-action:manipulation; transition:transform .15s;
}
.node-expand.expanded { transform:rotate(90deg); }
.node-expand.leaf { background:none; color:transparent; cursor:default; }

.node-check {
  width:20px; height:20px; border:1.5px solid var(--border); border-radius:2px;
  cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  touch-action:manipulation; transition:all .15s;
}
.node-check.checked { background:var(--border-strong); border-color:var(--border-strong); }
.node-check.checked::after { content:'✓'; color:var(--on-dark); font-size:11px; font-weight:700; }

.node-body { flex:1; min-width:0; }
.node-title { font-size:14px; line-height:1.4; word-break:break-all; }
.node-done .node-title { text-decoration:line-through; opacity:.45; }
.node-meta { display:flex; gap:4px; margin-top:5px; flex-wrap:wrap; align-items:center; }
.badge { font-family:'Rajdhani','Zen Kaku Gothic New',sans-serif; font-size:11px; padding:1px 6px; border-radius:2px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; display:inline-flex; align-items:center; }
.badge-a { background:var(--pa); color:var(--on-dark); }
.badge-b { background:var(--pb); color:var(--on-dark); }
.badge-c { background:var(--pc); color:var(--on-dark); }
.badge-d { background:transparent; color:var(--sub); border:1px solid var(--pd); }
.badge-single { background:transparent; color:var(--sub); border:1px solid var(--border); }
.badge-project { background:var(--border-strong); color:var(--on-dark); }
.badge-recurring { background:transparent; color:var(--sub); border:1px solid var(--border); }
.pri-icon { display:inline-flex; gap:2px; margin-right:4px; }
.pri-dot { width:6px; height:6px; border:1px solid currentColor; box-sizing:border-box; }
.pri-dot.on { background:currentColor; }
.node-note { font-size:12px; color:var(--sub); margin-top:3px; line-height:1.5; }

.progress-wrap { margin-top:6px; display:flex; align-items:center; gap:8px; }
.progress-track { flex:1; height:3px; border-radius:0; background:var(--card2); overflow:hidden; }
.progress-fill { height:100%; border-radius:0; background:var(--border-strong); transition:width .3s; }
.progress-label { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--sub); flex-shrink:0; }

.node-actions { display:flex; gap:2px; flex-shrink:0; }
.node-act-btn {
  width:28px; height:28px; border-radius:2px; border:none; background:none;
  color:var(--sub); cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:14px; touch-action:manipulation;
}
.node-act-btn:active { background:var(--card2); }
.node-act-btn.add-child { color:var(--border-strong); }
.node-act-btn.edit { color:var(--border-strong); }
.node-act-btn.del { color:var(--border); }
.node-act-btn.del:active { color:var(--accent); }

.node-children {
  border-top:1px solid var(--border); padding:6px 0 6px 14px;
  display:flex; flex-direction:column; gap:5px; background:var(--bg);
}
.node-children .tree-node { margin-bottom:0; }
.tree-node.drag-over { box-shadow:0 0 0 2px var(--border-strong); }
.tree-node.dragging { opacity:.4; }

/* ══════════════════════════
   MATRIX VIEW
══════════════════════════ */
.matrix-view { padding:10px 12px 24px; display:flex; flex-direction:column; gap:0; }
.quad-section { border-radius:3px; overflow:hidden; border:1px solid var(--border); margin-bottom:6px; }
.quad-header { padding:8px 12px; display:flex; align-items:center; gap:10px; font-family:'Rajdhani','Zen Kaku Gothic New',sans-serif; font-size:13px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; }
.quad-header-a { background:var(--pa); color:var(--on-dark); }
.quad-header-b { background:var(--pb); color:var(--on-dark); }
.quad-header-c { background:var(--pc); color:var(--on-dark); }
.quad-header-d { background:var(--pd); color:var(--text); }
.quad-header-done { background:var(--card2); color:var(--sub); }
.quad-label { flex:1; } .quad-count { opacity:.7; font-size:11px; font-family:'JetBrains Mono',monospace; }
.matrix-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--border); background:var(--card); }
.matrix-item:last-child { border-bottom:none; }
.matrix-check { width:20px; height:20px; border:1.5px solid var(--border); border-radius:2px; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:10px; touch-action:manipulation; transition:all .15s; }
.matrix-check.checked { background:var(--border-strong); border-color:var(--border-strong); color:var(--on-dark); }
.matrix-body { flex:1; min-width:0; }
.matrix-title { font-size:14px; line-height:1.4; word-break:break-all; }
.matrix-path { font-size:11px; color:var(--sub); margin-top:2px; font-family:'JetBrains Mono',monospace; }
.matrix-done .matrix-title { text-decoration:line-through; opacity:.45; }

/* SECTION DIVIDER (double-line with dots) */
.section-divider {
  height:13px; margin:4px 0;
  background:
    linear-gradient(var(--border) 0%,var(--border) 100%) top/100% 1px no-repeat,
    linear-gradient(var(--border) 0%,var(--border) 100%) bottom/100% 1px no-repeat,
    repeating-linear-gradient(90deg,var(--border) 0,var(--border) 2px,transparent 2px,transparent 10px) center/100% 1px no-repeat;
}

/* TAB BAR */
.tabbar {
  position:fixed; bottom:0; left:0; right:0;
  height:calc(var(--tab-h) + var(--safe-bottom)); padding-bottom:var(--safe-bottom);
  background:var(--card); border-top:2px solid var(--border-strong);
  display:flex; align-items:stretch; z-index:20;
}
.tab-btn {
  flex:1; background:none; border:none; color:var(--sub); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font-size:10px; font-family:'Rajdhani','Zen Kaku Gothic New',sans-serif; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  touch-action:manipulation; position:relative; transition:background .15s, color .15s;
}
.tab-btn.active { color:var(--on-dark); background:var(--border-strong); }
.tab-btn.active::after { display:none; }
.tab-icon { font-size:20px; line-height:1; }
.tab-badge { position:absolute; top:6px; right:8px; background:var(--accent); color:white; font-size:10px; font-family:'JetBrains Mono',monospace; padding:1px 5px; border-radius:2px; min-width:16px; text-align:center; }
.fab { width:52px; height:52px; border-radius:3px; background:var(--border-strong); border:none; color:var(--on-dark); font-size:26px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .15s; touch-action:manipulation; flex-shrink:0; align-self:center; margin:0 4px; }
.fab:active { transform:scale(.93); }

/* SHEETS */
.sheet-overlay { position:fixed; inset:0; background:rgba(51,47,38,.5); z-index:30; display:none; }
.sheet-overlay.open { display:block; }
.sheet { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-radius:0; border-top:2px solid var(--border-strong); z-index:31; padding:0 16px calc(16px + var(--safe-bottom)); transform:translateY(100%); transition:transform .3s cubic-bezier(.32,0,.67,0); max-height:92dvh; overflow-y:auto; }
.sheet.open { transform:translateY(0); transition:transform .3s cubic-bezier(.33,1,.68,1); }
.sheet-handle { width:40px; height:3px; background:var(--border); border-radius:0; margin:12px auto 14px; }
.sheet-title { font-family:'Rajdhani','Zen Kaku Gothic New',sans-serif; font-size:28px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:2px; }
.sheet-subtitle { font-size:12px; color:var(--sub); margin-bottom:12px; }

.field-label { font-family:'Rajdhani','Zen Kaku Gothic New',sans-serif; font-size:11px; color:var(--sub); letter-spacing:.12em; text-transform:uppercase; font-weight:700; margin-bottom:5px; margin-top:14px; }
.f-input, .f-textarea, .f-select { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:2px; padding:10px 12px; font-family:'Zen Kaku Gothic New',sans-serif; font-size:15px; outline:none; transition:border-color .15s; -webkit-appearance:none; }
.f-input:focus, .f-textarea:focus, .f-select:focus { border-color:var(--border-strong); }
.f-textarea { resize:none; min-height:72px; }
.f-select { cursor:pointer; }
.f-select option { background:var(--card); }

.seg-group { display:flex; gap:5px; flex-wrap:wrap; }
.seg-btn { flex:1; min-width:0; padding:9px 4px; border-radius:2px; border:1.5px solid var(--border); background:none; color:var(--sub); font-family:'Rajdhani','Zen Kaku Gothic New',sans-serif; font-size:13px; font-weight:700; cursor:pointer; text-align:center; transition:all .15s; touch-action:manipulation; line-height:1.3; text-transform:uppercase; letter-spacing:.04em; }
.seg-btn.sel-single,
.seg-btn.sel-project,
.seg-btn.sel-recurring { border-color:var(--border-strong); background:var(--border-strong); color:var(--on-dark); }
.seg-btn.sel-A { border-color:var(--pa); background:var(--pa); color:var(--on-dark); }
.seg-btn.sel-B { border-color:var(--pb); background:var(--pb); color:var(--on-dark); }
.seg-btn.sel-C { border-color:var(--pc); background:var(--pc); color:var(--on-dark); }
.seg-btn.sel-D { border-color:var(--pd); background:var(--pd); color:var(--text); }

.sheet-actions { display:flex; gap:10px; margin-top:18px; }
.btn { flex:1; padding:13px; border-radius:2px; border:none; cursor:pointer; font-size:15px; font-family:'Rajdhani','Zen Kaku Gothic New',sans-serif; font-weight:700; letter-spacing:.06em; text-transform:uppercase; transition:opacity .15s; touch-action:manipulation; }
.btn:active { opacity:.75; }
.btn-primary { background:var(--border-strong); color:var(--on-dark); }
.btn-ghost { background:var(--card2); color:var(--sub); }

.menu-item { display:flex; align-items:center; gap:14px; padding:15px 4px; border-bottom:1px solid var(--border); cursor:pointer; font-size:15px; touch-action:manipulation; }
.menu-item:last-child { border-bottom:none; }
.menu-item:active { opacity:.6; }
.menu-icon { font-size:20px; width:28px; text-align:center; }

/* LOGIN */
.login-screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; background:var(--bg); z-index:100; padding:32px; }
.login-screen.hidden { display:none; }
.login-title { font-family:'Rajdhani','Zen Kaku Gothic New',sans-serif; font-size:36px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
.login-sub { font-size:13px; color:var(--sub); text-align:center; line-height:1.7; }
.login-btn { padding:14px 32px; border-radius:2px; background:var(--border-strong); border:none; color:var(--on-dark); font-size:15px; font-family:'Rajdhani','Zen Kaku Gothic New',sans-serif; font-weight:700; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; }

.empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--sub); font-size:13px; padding:60px 0; }
.empty-icon { font-size:40px; opacity:.3; }

/* ══════════════════════════
   TODAY VIEW
══════════════════════════ */
.today-view { padding:10px 12px 24px; }
.today-item {
  background:var(--card); border:1px solid var(--border);
  border-radius:3px; margin-bottom:6px;
  display:flex; align-items:center; gap:10px; padding:10px 10px 10px 12px;
}
.today-item.today-done { opacity:.45; }
.today-item.today-done .today-title { text-decoration:line-through; }
.today-check {
  width:20px; height:20px; border:1.5px solid var(--border); border-radius:2px;
  cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  touch-action:manipulation; transition:all .15s;
}
.today-check.checked { background:var(--border-strong); border-color:var(--border-strong); }
.today-check.checked::after { content:'✓'; color:var(--on-dark); font-size:11px; font-weight:700; }
.today-body { flex:1; min-width:0; }
.today-title { font-size:14px; line-height:1.4; word-break:break-all; }
.today-path { font-size:10px; color:var(--sub); margin-top:2px; font-family:'JetBrains Mono',monospace; }
.today-meta { display:flex; gap:4px; margin-top:4px; }
.today-actions { display:flex; gap:2px; flex-shrink:0; }
.star-btn {
  width:28px; height:28px; border-radius:2px; border:none; background:none;
  color:var(--border); cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center; touch-action:manipulation;
}
.star-btn:active { background:var(--card2); }
.star-btn.on { color:var(--border-strong); }

.date-display { cursor:pointer; color:var(--sub); user-select:none; display:flex; align-items:center; gap:8px; }
.date-display.has-date { color:var(--text); }
.cal-day {
  padding:8px 0; border-radius:2px; cursor:pointer;
  font-size:13px; font-family:'JetBrains Mono',monospace; text-align:center;
  touch-action:manipulation;
}
.cal-day:active { opacity:.7; }
.cal-day.today { border:1px solid var(--border-strong); }
.cal-day.selected { background:var(--border-strong); color:var(--on-dark); }
.cal-day.sun { color:var(--accent); }
.cal-day.sat { color:var(--border-strong); }


/* ══════════════════════════
   TIMELINE VIEW
══════════════════════════ */
.timeline-wrap { position:relative; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.timeline-body { flex:1; display:flex; overflow:hidden; }

.tl-left { width:180px; flex-shrink:0; overflow:hidden; border-right:1px solid var(--border); background:var(--bg); z-index:3; }
.tl-right { flex:1; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; }
.tl-right::-webkit-scrollbar { display:none; }

.tl-header-left {
  height:48px; background:var(--card); border-bottom:1px solid var(--border); border-right:1px solid var(--border);
  display:flex; align-items:center; padding:0 10px;
  font-family:'Rajdhani','Zen Kaku Gothic New',sans-serif; font-size:10px; color:var(--sub); font-weight:700; text-transform:uppercase; letter-spacing:.1em;
  flex-shrink:0; width:180px; box-sizing:border-box;
}
.tl-header-right { height:48px; background:var(--card); border-bottom:1px solid var(--border); position:relative; flex-shrink:0; }
.tl-month-label { position:absolute; top:4px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text); font-weight:600; white-space:nowrap; padding-left:4px; }

.tl-scroll-container { overflow-y:auto; overflow-x:hidden; flex:1; -webkit-overflow-scrolling:touch; }
.tl-scroll-container::-webkit-scrollbar { display:none; }
.tl-rows-left {}
.tl-rows-right { position:relative; }

<script>
const WORKER = 'https://mytasks.kinoerumesu2000.workers.dev';
const LS_KEY = 'sasami_tasks_v4';
const SID_KEY = 'mytasks_sid';

function sidHeader() {
  const sid = localStorage.getItem(SID_KEY);
  return sid ? { Authorization: `Bearer ${sid}` } : {};
}

const isDesktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
let dragSrcId = null;

let nodes = [];
let inbox = [];
let currentView = 'inbox';
let hideDone = false;

// form state
let formParentId = null;
let formEditId = null;
let formType = 'single';
let formPriority = 'B';
let clType = 'single';
let clPriority = 'B';
let clarifyTargetId = null;


// ══════════════════════
//   AUTH（Workerベース）
// ══════════════════════
async function checkAuth() {
  if (!localStorage.getItem(SID_KEY)) {
    document.getElementById('login-screen').classList.remove('hidden');
    return;
  }
  try {
    const res = await fetch(`${WORKER}/auth/status`, { headers: sidHeader() });
    const data = await res.json();
    if (data.loggedIn) {
      document.getElementById('login-screen').classList.add('hidden');
      await syncFromDrive();
    } else {
      localStorage.removeItem(SID_KEY);
      document.getElementById('login-screen').classList.remove('hidden');
    }
  } catch {
    // オフライン時はローカルキャッシュで動作
    const local = localStorage.getItem(LS_KEY);
    if (local) { const d = JSON.parse(local); nodes = d.nodes||[]; inbox = d.inbox||[]; }
    document.getElementById('login-screen').classList.add('hidden');
    render();
  }
}

function signIn() {
  // WorkerのOAuthフローへリダイレクト
  window.location.href = `${WORKER}/login`;
}

async function signOut() {
  try { await fetch(`${WORKER}/auth/logout`, { method: 'POST', headers: sidHeader() }); } catch {}
  localStorage.removeItem(SID_KEY);
  document.getElementById('login-screen').classList.remove('hidden');
}

// ══════════════════════
//   DRIVE（Worker経由）
// ══════════════════════
function getData() { return { nodes, inbox }; }

async function syncFromDrive() {
  setSyncStatus('busy', '読込中…');
  try {
    const res = await fetch(`${WORKER}/tasks`, { headers: sidHeader() });
    if (res.status === 401) {
      document.getElementById('login-screen').classList.remove('hidden');
      return;
    }
    const data = await res.json();
    nodes = data.nodes || []; inbox = data.inbox || [];
    localStorage.setItem(LS_KEY, JSON.stringify(getData()));
    setSyncStatus('ok', '同期済み'); render();
  } catch {
    setSyncStatus('err', 'オフライン');
    const local = localStorage.getItem(LS_KEY);
    if (local) { const d = JSON.parse(local); nodes = d.nodes||[]; inbox = d.inbox||[]; }
    render();
  }
}

async function saveToDrive() {
  const data = getData();
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  setSyncStatus('busy', '保存中…');
  try {
    const res = await fetch(`${WORKER}/tasks`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...sidHeader() },
      body: JSON.stringify(data),
    });
    if (res.status === 401) {
      setSyncStatus('err', '再ログイン必要');
      document.getElementById('login-screen').classList.remove('hidden');
      return;
    }
    setSyncStatus('ok', '保存済み');
  } catch { setSyncStatus('err', '保存失敗'); }
}

async function forceSyncToDrive() {
  await saveToDrive();
}

function setSyncStatus(t, m) { const el = document.getElementById('sync-status'); el.className = 'sync-status ' + t; el.textContent = m; }

// ══════════════════════
function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function findNode(id, arr) {
  for (const n of arr) { if (n.id === id) return n; const f = findNode(id, n.children||[]); if (f) return f; }
  return null;
}
function findParentArr(id, arr, root) {
  if (!root) root = arr;
  for (const n of arr) {
    if ((n.children||[]).some(c => c.id === id)) return n.children;
    const f = findParentArr(id, n.children||[], root);
    if (f) return f;
  }
  return null;
}
function deleteNodeById(id, arr) {
  const idx = arr.findIndex(n => n.id === id);
  if (idx !== -1) { arr.splice(idx, 1); return true; }
  for (const n of arr) if (deleteNodeById(id, n.children||[])) return true;
  return false;
}
function flattenNodes(arr, acc) { for (const n of arr) { acc.push(n); flattenNodes(n.children||[], acc); } return acc; }
function isLeaf(n) { return !(n.children||[]).length; }
function getPath(id, arr, path) {
  for (const n of arr) {
    if (n.id === id) return path;
    const f = getPath(id, n.children||[], [...path, n.title]);
    if (f !== null) return f;
  }
  return null;
}
function calcProgress(n) {
  const leaves = []; collectLeaves(n.children||[], leaves);
  if (!leaves.length) return null;
  const done = leaves.filter(l => l.done).length;
  return { done, total: leaves.length, pct: Math.round(done/leaves.length*100) };
}
function collectLeaves(arr, acc) { for (const n of arr) { if (isLeaf(n)) acc.push(n); else collectLeaves(n.children, acc); } }
function getAllNodeOptions(arr, depth, acc) {
  for (const n of arr) {
    acc.push({ id: n.id, label: '　'.repeat(depth) + n.title });
    getAllNodeOptions(n.children||[], depth+1, acc);
  }
  return acc;
}
// ツリー上で src が dst の祖先かチェック（循環防止）
function isAncestor(srcId, dstId, arr) {
  const src = findNode(srcId, arr);
  if (!src) return false;
  return findNode(dstId, src.children||[]) !== null || (src.children||[]).some(c => isAncestor(c.id, dstId, [c]));
}

// ══════════════════════
//   TOGGLE
// ══════════════════════
function toggleHideDone() {
  hideDone = !hideDone;
  document.getElementById('toggle-track').classList.toggle('on', hideDone);
  render();
}

// ══════════════════════
//   VIEW
// ══════════════════════
function switchView(v) {
  currentView = v;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const tabEl = document.getElementById('tab-' + v);
  if (tabEl) tabEl.classList.add('active');
  const labels = { inbox: 'Inbox', today: '今日', tree: 'ツリー', matrix: 'マトリクス', timeline: 'タイムライン' };
  document.getElementById('header-title').textContent = labels[v] || v;
  render();
}

// ══════════════════════
//   RENDER
// ══════════════════════
function updateInboxBadge() {
  const badge = document.getElementById('inbox-badge');
  if (inbox.length) { badge.textContent = inbox.length; badge.style.display = 'block'; }
  else badge.style.display = 'none';
}

function render() {
  updateInboxBadge();
  const el = document.getElementById('content');
  if (currentView === 'inbox') el.innerHTML = renderInbox();
  else if (currentView === 'today') el.innerHTML = renderToday();
  else if (currentView === 'tree') el.innerHTML = renderTree();
  else if (currentView === 'timeline') { el.innerHTML = renderTimeline(); initTimelineSync(); }
  else el.innerHTML = renderMatrix();
}

// ── INBOX ──
function renderInbox() {
  let html = '<div class="inbox-view">';
  // クイック入力
  html += `<div class="inbox-quick">
    <input class="inbox-quick-input" id="inbox-input" placeholder="気になったことを放り込む…" onkeydown="if(event.key==='Enter')addToInbox()" />
    <button class="inbox-add-btn" onclick="addToInbox()">＋</button>
  </div>`;

  if (!inbox.length) {
    html += '<div class="empty"><div class="empty-icon">▣</div><div>Inboxは空です</div></div>';
  } else {
    html += `<div class="inbox-section-label">${inbox.length} 件 未整理</div>`;
    html += inbox.map(item => `
      <div class="inbox-card" id="inbox-${item.id}">
        <div class="inbox-card-header" onclick="toggleInboxDetail('${item.id}')">
          <span class="inbox-card-title">${esc(item.title)}</span>
          <div class="inbox-card-actions" onclick="event.stopPropagation()">
            <button class="inbox-act-btn clarify" onclick="openClarify('${item.id}')" title="Clarify">→</button>
            <button class="inbox-act-btn del" onclick="deleteInboxItem('${item.id}')" title="削除">×</button>
          </div>
          <span class="inbox-expand-icon" id="inbox-icon-${item.id}">▼</span>
        </div>
        <div class="inbox-card-detail" id="inbox-detail-${item.id}">
          <div style="padding-top:10px;font-size:12px;color:var(--muted)">
            「→」ボタンでClarify（ツリーへ移動）できます。<br>
            追加日: ${new Date(item.createdAt).toLocaleDateString('ja-JP')}
          </div>
        </div>
      </div>`).join('');
  }
  html += '</div>';
  return html;
}

function addToInbox() {
  const input = document.getElementById('inbox-input');
  const title = input.value.trim();
  if (!title) return;
  inbox.unshift({ id: makeId(), title, createdAt: Date.now() });
  input.value = '';
  render(); saveToDrive();
}

function toggleInboxDetail(id) {
  const detail = document.getElementById('inbox-detail-' + id);
  const icon = document.getElementById('inbox-icon-' + id);
  if (!detail) return;
  detail.classList.toggle('open');
  icon.classList.toggle('open');
}

function deleteInboxItem(id) {
  if (!confirm('このInboxタスクを削除しますか？')) return;
  inbox = inbox.filter(i => i.id !== id);
  render(); saveToDrive();
}

// ── TREE ──
function renderTree() {
  const filtered = hideDone ? nodes.filter(n => !n.done) : nodes;
  if (!nodes.length) return '<div class="tree-view"><div class="empty"><div class="empty-icon">◎</div><div>＋でノードを追加</div></div></div>';
  return `<div class="tree-view">${renderTreeNodes(filtered)}<button style="width:100%;padding:12px;border-radius:3px;border:1px dashed var(--border);background:none;color:var(--sub);font-size:13px;cursor:pointer;margin-top:4px;font-family:'Zen Kaku Gothic New',sans-serif" onclick="openForm(null,false)">＋ ルートにノードを追加</button></div>`;
}

function renderTreeNodes(arr) { return arr.map(n => renderTreeNode(n)).join(''); }

function renderTreeNode(n) {
  const children = n.children||[];
  const hasChildren = children.length > 0;
  const expanded = n.expanded !== false;
  const barCls = 'bar-'+n.priority.toLowerCase();
  const bPri = 'badge-'+n.priority.toLowerCase();
  const bType = 'badge-'+n.type;
  const typeLabel = {single:'単発',project:'PJ',recurring:'定期'}[n.type];
  const doneClass = n.done ? 'node-done' : '';

  const expandBtn = hasChildren
    ? `<button class="node-expand ${expanded?'expanded':''}" onclick="toggleExpand('${n.id}')">▶</button>`
    : `<button class="node-expand leaf">·</button>`;

  const noteHtml = n.note ? `<div class="node-note">${esc(n.note)}</div>` : '';
  const recurHtml = n.type==='recurring'&&n.interval ? `<div class="node-note" style="color:var(--recur)">↻ ${esc(n.interval)}</div>` : '';
  let deadlineHtml = '';
  if (n.deadline) {
    const dl = new Date(n.deadline + 'T00:00:00'); const today = new Date(); today.setHours(0,0,0,0);
    const diff = Math.ceil((dl - today) / 86400000);
    const dlColor = n.done ? 'var(--c)' : diff < 0 ? 'var(--a)' : diff <= 3 ? 'var(--b)' : 'var(--muted)';
    const dlLabel = diff < 0 ? `期限切れ ${Math.abs(diff)}日前` : diff === 0 ? '今日' : `${diff}日後`;
    deadlineHtml = `<div class="node-note" style="color:${dlColor}">⧗ ${n.deadline}（${dlLabel}）</div>`;
  }

  let progressHtml = '';
  if (hasChildren) {
    const prog = calcProgress(n);
    if (prog) progressHtml = `<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${prog.pct}%"></div></div><span class="progress-label">${prog.done}/${prog.total} (${prog.pct}%)</span></div>`;
  }

  const visibleChildren = hideDone ? children.filter(c => !c.done) : children;
  const childrenHtml = hasChildren && expanded
    ? `<div class="node-children" data-parent-id="${n.id}">
        ${visibleChildren.map(c => renderTreeNode(c)).join('')}
       </div>`
    : '';

  return `
    <div class="tree-node ${doneClass}" id="tnode-${n.id}" data-id="${n.id}"
      ${isDesktop ? `draggable="true" ondragstart="dragStart(event,'${n.id}')" ondragend="dragEnd()" ondragover="dragOver(event,'${n.id}')" ondrop="dragDrop(event,'${n.id}')"` : ''}>
      <div class="node-row">
        <div class="node-bar ${barCls}"></div>
        ${expandBtn}
        <div class="node-check ${n.done?'checked':''}" onclick="toggleDone('${n.id}')"></div>
        <div class="node-body">
          <div class="node-title">${esc(n.title)}</div>
          <div class="node-meta"><span class="badge ${bPri}">${priIcon(n.priority)}${n.priority}</span><span class="badge ${bType}">${typeLabel}</span></div>
          ${noteHtml}${recurHtml}${deadlineHtml}${progressHtml}
        </div>
        <div class="node-actions">
          <button class="star-btn ${n.today?'on':''}" onclick="toggleToday('${n.id}')" title="今日やる">★</button>
          <button class="node-act-btn" onclick="moveNodeUp('${n.id}')" title="上に移動">↑</button>
          <button class="node-act-btn" onclick="moveNodeDown('${n.id}')" title="下に移動">↓</button>
          <button class="node-act-btn add-child" onclick="openForm('${n.id}',false)" title="子を追加">＋</button>
          <button class="node-act-btn edit" onclick="openForm('${n.id}',true)" title="編集">✎</button>
          <button class="node-act-btn del" onclick="deleteNode('${n.id}')" title="削除">×</button>
        </div>
      </div>
      ${childrenHtml}
    </div>`;
}


// ── MATRIX ──
function renderMatrix() {
  const all = flattenNodes(nodes, []);
  const leaves = all.filter(isLeaf);
  const active = leaves.filter(n => !n.done);
  const done = leaves.filter(n => n.done);
  const quads = [
    {key:'A',label:'A ― 緊急×重要',cls:'quad-header-a'},
    {key:'B',label:'B ― 重要',cls:'quad-header-b'},
    {key:'C',label:'C ― 緊急',cls:'quad-header-c'},
    {key:'D',label:'D ― その他',cls:'quad-header-d'},
  ];
  let html = '<div class="matrix-view">';
  let needDivider = false;
  for (const q of quads) {
    const items = active.filter(n => n.priority === q.key);
    if (!items.length) continue;
    if (needDivider) html += '<div class="section-divider"></div>';
    needDivider = true;
    html += `<div class="quad-section"><div class="quad-header ${q.cls}"><span class="quad-label">${q.label}</span><span class="quad-count">${items.length}</span></div>`;
    html += items.map(n => {
      const path = getPath(n.id, nodes, []);
      const pathStr = path&&path.length ? path.join(' › ') : '';
      return `<div class="matrix-item">
        <div class="matrix-check" onclick="toggleDone('${n.id}')"></div>
        <div class="matrix-body">
          <div class="matrix-title">${esc(n.title)}</div>
          ${pathStr?`<div class="matrix-path">${esc(pathStr)}</div>`:''}
        </div>
        <div class="today-actions">
          <button class="star-btn ${n.today?'on':''}" onclick="toggleToday('${n.id}')" title="今日やる">★</button>
          <button class="node-act-btn edit" onclick="openForm('${n.id}',true)" title="編集">✎</button>
        </div>
      </div>`;
    }).join('');
    html += '</div>';
  }
  if (!hideDone && done.length) {
    html += `<div class="quad-section"><div class="quad-header quad-header-done"><span class="quad-label">完了済み</span><span class="quad-count">${done.length}</span></div>`;
    html += done.map(n => `<div class="matrix-item matrix-done">
      <div class="matrix-check checked" onclick="toggleDone('${n.id}')">✓</div>
      <div class="matrix-body"><div class="matrix-title">${esc(n.title)}</div></div>
    </div>`).join('');
    html += '</div>';
  }
  if (!active.length && (hideDone||!done.length)) html += '<div class="empty"><div class="empty-icon">◎</div><div>タスクなし</div></div>';
  html += '</div>';
  return html;
}

// ── TODAY ──
function renderToday() {
  const priOrder = {A:0, B:1, C:2, D:3};
  const all = flattenNodes(nodes, []);
  const todayItems = all.filter(n => n.today && !n.done);
  todayItems.sort((a, b) => (priOrder[a.priority] ?? 3) - (priOrder[b.priority] ?? 3));

  const quickInput = `<div class="inbox-quick">
    <input class="inbox-quick-input" id="today-input" placeholder="今日やることを追加…" onkeydown="if(event.key==='Enter')addToToday()" />
    <button class="inbox-add-btn" onclick="addToToday()">＋</button>
  </div>`;

  if (!todayItems.length) {
    return `<div class="today-view">${quickInput}<div class="empty"><div class="empty-icon">★</div><div>今日やるタスクなし</div></div></div>`;
  }

  const items = todayItems.map(n => {
    const path = getPath(n.id, nodes, []);
    const parentName = path && path.length ? path[path.length - 1] : '';
    const bPri = 'badge-' + n.priority.toLowerCase();
    return `<div class="today-item">
      <div class="today-check" onclick="toggleDone('${n.id}')"></div>
      <div class="today-body">
        <div class="today-title">${esc(n.title)}</div>
        <div class="today-meta"><span class="badge ${bPri}">${priIcon(n.priority)}${n.priority}</span></div>
        ${parentName ? `<div class="today-path">${esc(parentName)}</div>` : ''}
      </div>
      <div class="today-actions">
        <button class="star-btn on" onclick="toggleToday('${n.id}')" title="今日から外す">★</button>
        <button class="node-act-btn edit" onclick="openForm('${n.id}',true)" title="編集">✎</button>
      </div>
    </div>`;
  }).join('');

  return `<div class="today-view">${quickInput}${items}</div>`;
}

function addToToday() {
  const input = document.getElementById('today-input');
  const title = input.value.trim();
  if (!title) return;
  const node = { id: makeId(), title, type: 'single', priority: 'B', note: null, interval: null, deadline: null, done: false, expanded: true, children: [], today: true, createdAt: Date.now() };
  nodes.push(node);
  input.value = '';
  render(); saveToDrive();
}

function toggleToday(id) {
  const n = findNode(id, nodes); if (!n) return;
  n.today = !n.today;
  render(); saveToDrive();
}

//   CALENDAR PICKER
// ══════════════════════
let calTarget = null;
let calYear, calMonth;

function openCal(target) {
  calTarget = target;
  const val = document.getElementById(target).value;
  const d = val ? new Date(val + 'T00:00:00') : new Date();
  calYear = d.getFullYear();
  calMonth = d.getMonth();
  renderCal();
  document.getElementById('cal-overlay').classList.add('open');
  document.getElementById('cal-sheet').classList.add('open');
}

function closeCal() {
  document.getElementById('cal-overlay').classList.remove('open');
  document.getElementById('cal-sheet').classList.remove('open');
}

function calPrevMonth() {
  calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCal();
}

function calNextMonth() {
  calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCal();
}

function calSelect(dateStr) {
  document.getElementById(calTarget).value = dateStr;
  const disp = document.getElementById(calTarget + '-display');
  disp.textContent = '⧗ ' + dateStr;
  disp.classList.add('has-date');
  closeCal();
}

function calClear() {
  document.getElementById(calTarget).value = '';
  const disp = document.getElementById(calTarget + '-display');
  disp.textContent = '⧗ 日付を選択';
  disp.classList.remove('has-date');
  closeCal();
}

function setDateDisplay(target, val) {
  const disp = document.getElementById(target + '-display');
  if (!disp) return;
  if (val) { disp.textContent = '⧗ ' + val; disp.classList.add('has-date'); }
  else { disp.textContent = '⧗ 日付を選択'; disp.classList.remove('has-date'); }
}

function renderCal() {
  const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const DAYS = ['日','月','火','水','木','金','土'];
  document.getElementById('cal-month-label').textContent = `${calYear}年 ${MONTHS[calMonth]}`;
  const today = new Date(); today.setHours(0,0,0,0);
  const selected = document.getElementById(calTarget).value;
  let html = DAYS.map((d, i) => {
    const c = i===0 ? 'var(--accent)' : i===6 ? 'var(--border-strong)' : 'var(--sub)';
    return `<div style="font-size:10px;color:${c};padding:4px 0;text-align:center;font-family:'JetBrains Mono',monospace">${d}</div>`;
  }).join('');
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  for (let i = 0; i < firstDay; i++) html += '<div></div>';
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = new Date(calYear, calMonth, d).getTime() === today.getTime();
    const isSel = dateStr === selected;
    const dow = new Date(calYear, calMonth, d).getDay();
    const dowCls = dow===0 ? ' sun' : dow===6 ? ' sat' : '';
    const selCls = isSel ? ' selected' : isToday ? ' today' : '';
    html += `<div class="cal-day${dowCls}${selCls}" onclick="calSelect('${dateStr}')">${d}</div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const PRI_AXES = { A:[1,1], B:[1,0], C:[0,1], D:[0,0] };
function priIcon(p) {
  const [imp, urg] = PRI_AXES[p] || [0,0];
  return `<span class="pri-icon" title="重要度/緊急度"><span class="pri-dot${imp?' on':''}"></span><span class="pri-dot${urg?' on':''}"></span></span>`;
}

function openForm(id, isEdit) {
  formEditId = isEdit ? id : null;
  formParentId = isEdit ? null : id;
  if (isEdit) {
    const n = findNode(id, nodes); if (!n) return;
    formType = n.type; formPriority = n.priority;
    document.getElementById('form-title').textContent = 'ノードを編集';
    document.getElementById('form-subtitle').textContent = '';
    document.getElementById('f-title').value = n.title;
    document.getElementById('f-note').value = n.note||'';
    document.getElementById('f-interval').value = n.interval||'';
    document.getElementById('f-deadline').value = n.deadline||'';
    setDateDisplay('f-deadline', n.deadline||'');
    document.getElementById('form-submit-btn').textContent = '保存する';
    // 親ノード変更フィールドを構築
    const parentWrap = document.getElementById('f-parent-wrap');
    parentWrap.style.display = 'block';
    const parentSel = document.getElementById('f-parent');
    parentSel.innerHTML = '<option value="">── ルート ──</option>';
    getAllNodeOptions(nodes, 0, []).forEach(opt => {
      if (opt.id === id) return; // 自分自身は除外
      const el = document.createElement('option');
      el.value = opt.id; el.textContent = opt.label;
      parentSel.appendChild(el);
    });
    // 現在の親を選択状態に
    const curParentArr = findParentArr(id, nodes);
    if (curParentArr && curParentArr !== nodes) {
      // 親のIDを探す
      const allNodes = flattenNodes(nodes, []);
      const curParent = allNodes.find(nd => (nd.children||[]).some(c => c.id === id));
      if (curParent) parentSel.value = curParent.id;
    }
  } else {
    formType = 'single'; formPriority = 'B';
    document.getElementById('form-title').textContent = 'ノードを追加';
    const parent = id ? findNode(id, nodes) : null;
    document.getElementById('form-subtitle').textContent = parent ? '親: '+parent.title : 'ルートに追加';
    document.getElementById('f-title').value = '';
    document.getElementById('f-note').value = '';
    document.getElementById('f-interval').value = '';
    document.getElementById('f-deadline').value = '';
    setDateDisplay('f-deadline', '');
    document.getElementById('f-parent-wrap').style.display = 'none';
    document.getElementById('form-submit-btn').textContent = '追加する';
  }
  document.getElementById('f-interval-wrap').style.display = formType==='recurring' ? 'block' : 'none';
  refreshSeg();
  document.getElementById('form-overlay').classList.add('open');
  document.getElementById('form-sheet').classList.add('open');
  setTimeout(() => document.getElementById('f-title').focus(), 300);
}
function closeForm() {
  document.getElementById('form-overlay').classList.remove('open');
  document.getElementById('form-sheet').classList.remove('open');
}
function selectSeg(axis, val) {
  if (axis==='type') { formType=val; document.getElementById('f-interval-wrap').style.display=val==='recurring'?'block':'none'; }
  if (axis==='priority') formPriority=val;
  refreshSeg();
}
function refreshSeg() {
  document.querySelectorAll('#seg-type .seg-btn').forEach(b => { b.className='seg-btn'+(b.dataset.val===formType?' sel-'+formType:''); });
  document.querySelectorAll('#seg-priority .seg-btn').forEach(b => { b.className='seg-btn'+(b.dataset.val===formPriority?' sel-'+formPriority:''); });
}
function submitNode() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }
  const note = document.getElementById('f-note').value.trim()||null;
  const interval = document.getElementById('f-interval').value.trim()||null;
  const deadline = document.getElementById('f-deadline').value||null;
  if (formEditId) {
    const n = findNode(formEditId, nodes);
    if (n) {
      n.title=title; n.type=formType; n.priority=formPriority;
      n.note=note; n.interval=interval; n.deadline=deadline;
      // 親変更
      const newParentId = document.getElementById('f-parent').value;
      const curParentArr = findParentArr(formEditId, nodes) || nodes;
      const curParentNode = flattenNodes(nodes,[]).find(nd => (nd.children||[]).some(c => c.id === formEditId));
      const curParentId = curParentNode ? curParentNode.id : '';
      if (newParentId !== curParentId && !isAncestorOf(formEditId, newParentId)) {
        // 元から除去して新しい親に追加
        deleteNodeById(formEditId, nodes);
        if (newParentId) {
          const p = findNode(newParentId, nodes);
          if (p) { p.children = p.children||[]; p.children.push(n); p.expanded = true; }
          else nodes.push(n);
        } else {
          nodes.push(n);
        }
      }
    }
  } else {
    const node = { id:makeId(), title, type:formType, priority:formPriority, note, interval, deadline, done:false, expanded:true, children:[], createdAt:Date.now() };
    if (formParentId) { const p=findNode(formParentId,nodes); if(p){p.children=p.children||[];p.children.push(node);p.expanded=true;} }
    else nodes.push(node);
  }
  closeForm();
  if (currentView!=='tree') switchView('tree'); else render();
  saveToDrive();
}

// ══════════════════════
//   MOVE（↑↓ボタン＋親変更）
// ══════════════════════

// 兄弟配列を返す（rootならnodes）
function getSiblingArr(id) {
  const parentArr = findParentArr(id, nodes);
  return parentArr || nodes;
}

// ══════════════════════
//   DRAG & DROP（デスクトップのみ）
// ══════════════════════
function dragStart(e, id) {
  dragSrcId = id;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    const el = document.getElementById('tnode-' + id);
    if (el) el.classList.add('dragging');
  }, 0);
}

function dragEnd() {
  document.querySelectorAll('.tree-node').forEach(el => el.classList.remove('dragging', 'drag-over'));
  dragSrcId = null;
}

function dragOver(e, id) {
  if (!dragSrcId || dragSrcId === id) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.tree-node').forEach(el => el.classList.remove('drag-over'));
  const el = document.getElementById('tnode-' + id);
  if (el) el.classList.add('drag-over');
}

function dragDrop(e, targetId) {
  e.preventDefault();
  e.stopPropagation();
  document.querySelectorAll('.tree-node').forEach(el => el.classList.remove('drag-over'));
  if (!dragSrcId || dragSrcId === targetId) return;
  if (isAncestorOf(dragSrcId, targetId)) return;
  const src = findNode(dragSrcId, nodes);
  if (!src) return;
  const targetParentArr = findParentArr(targetId, nodes) || nodes;
  deleteNodeById(dragSrcId, nodes);
  const newIdx = targetParentArr.findIndex(n => n.id === targetId);
  if (newIdx >= 0) targetParentArr.splice(newIdx, 0, src);
  else targetParentArr.push(src);
  dragSrcId = null;
  render(); saveToDrive();
}

function moveNodeUp(id) {
  const arr = getSiblingArr(id);
  const idx = arr.findIndex(n => n.id === id);
  if (idx <= 0) return;
  [arr[idx-1], arr[idx]] = [arr[idx], arr[idx-1]];
  render(); saveToDrive();
}

function moveNodeDown(id) {
  const arr = getSiblingArr(id);
  const idx = arr.findIndex(n => n.id === id);
  if (idx < 0 || idx >= arr.length - 1) return;
  [arr[idx], arr[idx+1]] = [arr[idx+1], arr[idx]];
  render(); saveToDrive();
}

function isAncestorOf(srcId, dstId) {
  const src = findNode(srcId, nodes); if (!src) return false;
  return !!findNode(dstId, src.children||[]);
}


// ══════════════════════
//   TIMELINE
// ══════════════════════
const DAY_W = 28; // 1日あたりのpx幅

function renderTimeline() {
  // 全ノードを階層順にフラット化（hideDone対応）
  const rows = [];
  // 期日を持つノードのIDセットを先に収集
  function collectDeadlineIds(arr, acc) {
    for (const n of arr) {
      if (n.deadline) acc.add(n.id);
      collectDeadlineIds(n.children||[], acc);
    }
  }
  const deadlineIds = new Set();
  collectDeadlineIds(nodes, deadlineIds);

  // 期日を持つノードの祖先IDも表示対象に（文脈として）
  function hasDeadlineDescendant(n) {
    if (n.deadline) return true;
    return (n.children||[]).some(hasDeadlineDescendant);
  }

  function collectRows(arr, depth) {
    for (const n of arr) {
      if (hideDone && n.done) continue;
      const hasChildren = (n.children||[]).length > 0;
      const selfHasDeadline = !!n.deadline;
      const childHasDeadline = (n.children||[]).some(hasDeadlineDescendant);
      // 期日を持つノード、または期日持ちの子孫を持つ親ノードのみ表示
      if (!selfHasDeadline && !childHasDeadline) continue;
      rows.push({ node: n, depth, isParent: hasChildren });
      if (n.expanded !== false) collectRows(n.children||[], depth+1);
    }
  }
  collectRows(nodes, 0);

  // 期日の範囲を決定（今日±45日、ただし期日があればそれを含む）
  const today = new Date(); today.setHours(0,0,0,0);
  let minDate = new Date(today); minDate.setDate(minDate.getDate() - 14);
  let maxDate = new Date(today); maxDate.setDate(maxDate.getDate() + 60);
  for (const { node } of rows) {
    if (node.deadline) {
      const d = new Date(node.deadline);
      if (d < minDate) { minDate = new Date(d); minDate.setDate(minDate.getDate()-7); }
      if (d > maxDate) { maxDate = new Date(d); maxDate.setDate(maxDate.getDate()+7); }
    }
  }

  const totalDays = Math.ceil((maxDate - minDate) / 86400000);
  const totalW = totalDays * DAY_W;
  const todayOffset = Math.ceil((today - minDate) / 86400000) * DAY_W;

  // ヘッダー2段構造：上段=月ラベル、下段=週ラベル+曜日
  const DAYS_JA = ['日','月','火','水','木','金','土'];
  // 上段：月ラベル
  let monthRowHTML = `<div style="position:relative;height:22px;width:${totalW}px;border-bottom:1px solid var(--border)">`;
  let curMonth = -1;
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(minDate); d.setDate(d.getDate()+i);
    if (d.getMonth() !== curMonth) {
      curMonth = d.getMonth();
      monthRowHTML += `<span style="position:absolute;left:${i*DAY_W+3}px;top:4px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);font-weight:600">${d.getMonth()+1}月</span>`;
    }
  }
  monthRowHTML += '</div>';

  // 下段：日付（月曜のみ）+ 各日の曜日
  let dayRowHTML = `<div style="position:relative;height:26px;width:${totalW}px">`;
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(minDate); d.setDate(d.getDate()+i);
    const dow = d.getDay();
    const dowColor = dow === 0 ? 'var(--a)' : dow === 6 ? 'var(--d)' : 'var(--border)';
    // 月曜に日付ラベル
    if (dow === 1) {
      dayRowHTML += `<span style="position:absolute;left:${i*DAY_W+2}px;top:2px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--muted)">${d.getDate()}</span>`;
    }
    // 全日に曜日
    dayRowHTML += `<span style="position:absolute;bottom:2px;left:${i*DAY_W+2}px;font-size:8px;color:${dowColor};font-family:'Zen Kaku Gothic New',sans-serif">${DAYS_JA[dow]}</span>`;
  }
  dayRowHTML += '</div>';

  let headerHTML = `<div style="width:${totalW}px">${monthRowHTML}${dayRowHTML}</div>`;

  // グリッド縦線
  let gridHTML = '';
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(minDate); d.setDate(d.getDate()+i);
    const dow = d.getDay();
    if (dow === 1) gridHTML += `<div class="tl-grid-line" style="left:${i*DAY_W}px"></div>`;
    if (dow === 0 || dow === 6) gridHTML += `<div style="position:absolute;left:${i*DAY_W}px;top:0;bottom:0;width:${DAY_W}px;background:${dow===0?'rgba(51,47,38,.04)':'rgba(51,47,38,.03)'};pointer-events:none"></div>`;
  }
  // 今日線
  gridHTML += `<div class="tl-today-line" style="left:${todayOffset}px"></div>`;

  // 行生成
  let leftHTML = '';
  let rightHTML = '';

  for (const { node: n, depth, isParent } of rows) {
    const parentCls = isParent ? 'is-parent' : '';
    const barColor = `var(--${n.priority.toLowerCase() === 'a' ? 'a' : n.priority.toLowerCase() === 'b' ? 'b' : n.priority.toLowerCase() === 'c' ? 'c' : 'd'})`;

    // 左列
    leftHTML += `<div class="tl-row-left ${parentCls}" style="padding-left:${8 + depth*12}px">
      <div class="tl-indent-bar" style="background:${barColor}"></div>
      <span class="tl-node-title" title="${esc(n.title)}">${esc(n.title)}</span>
    </div>`;

    // 右列（期日マーカー）
    let markerHTML = '';
    if (n.deadline) {
      const dl = new Date(n.deadline + 'T00:00:00');
      const offset = Math.ceil((dl - minDate) / 86400000) * DAY_W;
      const diff = Math.ceil((dl - today) / 86400000);
      const cls = n.done ? 'done' : diff < 0 ? 'overdue' : diff <= 3 ? 'soon' : 'ok';
      const label = diff < 0 ? `${Math.abs(diff)}d超過` : diff === 0 ? '今日' : `${diff}d`;
      markerHTML = `<div class="tl-deadline ${cls}" style="left:${offset-2}px" onclick="quickEditDeadline('${n.id}')" title="${n.deadline}">${label}</div>`;
    }
    rightHTML += `<div class="tl-row ${parentCls}" style="width:${totalW}px">${markerHTML}</div>`;
  }

  if (!rows.length) {
    return '<div class="empty" style="margin-top:60px"><div class="empty-icon">⧗</div><div>ノードなし</div></div>';
  }

  return `<div class="timeline-wrap">
    <div style="display:flex;flex-shrink:0;border-bottom:1px solid var(--border)">
      <div class="tl-header-left">ノード</div>
      <div style="flex:1;overflow:hidden" id="tl-header-scroll">
        ${headerHTML}
      </div>
    </div>
    <div class="timeline-body">
      <div class="tl-left" id="tl-left-scroll">
        ${leftHTML}
      </div>
      <div class="tl-right" id="tl-right-scroll">
        <div class="tl-rows-right" style="position:relative;width:${totalW}px">
          ${gridHTML}
          ${rightHTML}
        </div>
      </div>
    </div>
  </div>`;
}

function initTimelineSync() {
  // 横スクロール同期（右列ヘッダーと本体）
  const rightScroll = document.getElementById('tl-right-scroll');
  const headerScroll = document.getElementById('tl-header-scroll');
  if (!rightScroll || !headerScroll) return;

  rightScroll.addEventListener('scroll', () => {
    headerScroll.scrollLeft = rightScroll.scrollLeft;
  }, { passive: true });

  // 今日付近に初期スクロール
  const today = new Date(); today.setHours(0,0,0,0);
  const todayOffset = 14 * DAY_W; // minDateは今日-14日
  setTimeout(() => {
    rightScroll.scrollLeft = Math.max(0, todayOffset - 60);
    headerScroll.scrollLeft = rightScroll.scrollLeft;
  }, 50);
}

function quickEditDeadline(nodeId) {
  const n = findNode(nodeId, nodes);
  if (!n) return;
  openForm(nodeId, true);
}

// ══════════════════════
//   MENU
// ══════════════════════
function openMenu() { document.getElementById('menu-overlay').classList.add('open'); document.getElementById('menu-sheet').classList.add('open'); }
function closeMenu() { document.getElementById('menu-overlay').classList.remove('open'); document.getElementById('menu-sheet').classList.remove('open'); }

async function generateApiKey() {
  const res = await fetch(`${WORKER}/api/setup-key`, { method: 'POST', headers: sidHeader() });
  if (!res.ok) { alert('ログインし直してから試してください'); return; }
  const { key } = await res.json();
  prompt('このAPIキーをコピーしてMCPサーバーに設定してください（再表示されません）', key);
}

// ══════════════════════
//   KEYBOARD
// ══════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeForm(); closeMenu(); closeClarify(); }
  if (e.key === 'Enter' && e.ctrlKey) submitNode();
});

// ══════════════════════
//   INIT
// ══════════════════════
window.onload = () => {
  // ログイン後のリダイレクト判定（sidはCookieに依存せずURLフラグメントで受け取る）
  if (window.location.hash.includes('sid=')) {
    const params = new URLSearchParams(window.location.hash.slice(1));
    const sid = params.get('sid');
    if (sid) localStorage.setItem(SID_KEY, sid);
    history.replaceState({}, '', window.location.pathname + window.location.search);
  }
  checkAuth();
};
</script>
