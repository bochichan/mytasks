<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>タスク</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
  --bg: #0f0f11;
  --surface: #16161a;
  --surface2: #1e1e24;
  --border: #2a2a33;
  --text: #e8e8f0;
  --muted: #6b6b80;
  --accent: #7c6aff;
  --accent-dim: #7c6aff22;
  --a: #ff6b6b;
  --b: #ffd166;
  --c: #06d6a0;
  --d: #4a9eff;
  --single: #a78bfa;
  --project: #f59e0b;
  --recur: #34d399;
  --tab-h: 60px;
  --header-h: 56px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }

.header {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 16px; gap: 10px; z-index: 10;
}
.header-title {
  flex: 1;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
  width: 36px; height: 36px; border-radius: 8px;
  border: 1px solid var(--border); background: none; color: var(--muted);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 18px; transition: all .15s; flex-shrink: 0;
}
.icon-btn:active { background: var(--surface2); }

.sync-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--muted);
  flex-shrink: 0;
}
.sync-status.ok   { color: var(--c); }
.sync-status.err  { color: var(--a); }
.sync-status.busy { color: var(--b); }

.filter-bar {
  position: fixed; top: var(--header-h); left: 0; right: 0;
  height: 44px; background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
  padding: 0 14px; overflow-x: auto; scrollbar-width: none; z-index: 9;
}
.filter-bar::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0; padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: none; color: var(--muted);
  font-family: 'Noto Sans JP', sans-serif; font-size: 12px;
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  transition: all .15s; white-space: nowrap;
}
.chip:active { opacity: .7; }
.chip.active { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
.chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.chip-count { font-family: 'JetBrains Mono', monospace; font-size: 10px; opacity: .7; }

.task-list {
  position: fixed;
  top: calc(var(--header-h) + 44px); left: 0; right: 0;
  bottom: calc(var(--tab-h) + var(--safe-bottom));
  overflow-y: auto; padding: 10px 12px 16px;
  display: flex; flex-direction: column; gap: 7px;
  -webkit-overflow-scrolling: touch;
}
.task-list::-webkit-scrollbar { display: none; }

.task-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 14px 14px 12px;
  display: flex; align-items: flex-start; gap: 12px;
  position: relative; overflow: hidden;
}
.task-card.done { opacity: .38; }

.quad-bar {
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 4px; border-radius: 12px 0 0 12px;
}
.bar-a { background: var(--a); }
.bar-b { background: var(--b); }
.bar-c { background: var(--c); }
.bar-d { background: var(--d); }

.task-check {
  width: 26px; height: 26px; border: 2px solid var(--border);
  border-radius: 8px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; touch-action: manipulation;
}
.task-check.checked { background: var(--accent); border-color: var(--accent); }
.task-check.checked::after { content: '✓'; color: white; font-size: 13px; font-weight: 700; }

.task-body { flex: 1; min-width: 0; padding-left: 4px; }
.task-title { font-size: 15px; line-height: 1.45; word-break: break-all; }
.done .task-title { text-decoration: line-through; }

.task-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; align-items: center; }

.tag {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  padding: 2px 7px; border-radius: 4px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .04em;
}
.tag-single    { background: #a78bfa22; color: var(--single); }
.tag-project   { background: #f59e0b22; color: var(--project); }
.tag-recurring { background: #34d39922; color: var(--recur); }

.quad-badge {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  padding: 2px 7px; border-radius: 4px; font-weight: 600;
}
.badge-a { background: #ff6b6b22; color: var(--a); }
.badge-b { background: #ffd16622; color: var(--b); }
.badge-c { background: #06d6a022; color: var(--c); }
.badge-d { background: #4a9eff22; color: var(--d); }

.task-note { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.5; }

.steps-list { margin-top: 9px; display: flex; flex-direction: column; gap: 1px; }
.step-item {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: var(--muted);
  padding: 7px 0; cursor: pointer;
  border-bottom: 1px solid var(--border);
  touch-action: manipulation;
}
.step-item:last-child { border-bottom: none; }
.step-check {
  width: 20px; height: 20px; border: 1.5px solid var(--border);
  border-radius: 5px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 11px;
}
.step-check.done-step { background: var(--muted); border-color: var(--muted); color: var(--bg); }
.steps-progress { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); }

.task-del {
  background: none; border: none; color: var(--border);
  cursor: pointer; font-size: 20px; padding: 2px 4px;
  line-height: 1; flex-shrink: 0; align-self: flex-start;
  touch-action: manipulation;
}
.task-del:active { color: var(--a); }

.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--tab-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; align-items: stretch; z-index: 20;
}
.tab-btn {
  flex: 1; background: none; border: none; color: var(--muted);
  cursor: pointer; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  font-size: 9px; font-family: 'JetBrains Mono', monospace;
  letter-spacing: .04em; touch-action: manipulation; position: relative;
}
.tab-btn.active { color: var(--accent); }
.tab-btn.active::after {
  content: ''; position: absolute; top: 0; left: 20%; right: 20%;
  height: 2px; background: var(--accent); border-radius: 0 0 2px 2px;
}
.tab-icon { font-size: 20px; line-height: 1; }

.fab {
  width: 52px; height: 52px; border-radius: 16px;
  background: var(--accent); border: none; color: white; font-size: 26px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px #7c6aff44; transition: transform .15s;
  touch-action: manipulation; flex-shrink: 0; align-self: center; margin: 0 4px;
}
.fab:active { transform: scale(.93); }

.sheet-overlay {
  position: fixed; inset: 0; background: #00000088; z-index: 30;
  display: none; animation: fadeIn .2s;
}
.sheet-overlay.open { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-radius: 20px 20px 0 0;
  border-top: 1px solid var(--border); z-index: 31;
  padding: 0 16px calc(16px + var(--safe-bottom));
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.32,0,.67,0);
  max-height: 92dvh; overflow-y: auto;
}
.sheet.open { transform: translateY(0); transition: transform .3s cubic-bezier(.33,1,.68,1); }
.sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 16px; }
.sheet-title { font-size: 16px; font-weight: 500; margin-bottom: 16px; }

.field-label {
  font-size: 11px; color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: .08em; text-transform: uppercase;
  margin-bottom: 6px; margin-top: 14px;
}

.f-input, .f-textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  color: var(--text); border-radius: 10px; padding: 12px 14px;
  font-family: 'Noto Sans JP', sans-serif; font-size: 15px;
  outline: none; transition: border-color .15s; -webkit-appearance: none;
}
.f-input:focus, .f-textarea:focus { border-color: var(--accent); }
.f-textarea { resize: none; min-height: 72px; }

.seg-group { display: flex; gap: 6px; flex-wrap: wrap; }
.seg-btn {
  flex: 1; min-width: 0; padding: 10px 4px; border-radius: 9px;
  border: 1.5px solid var(--border); background: none; color: var(--muted);
  font-family: 'Noto Sans JP', sans-serif; font-size: 12px;
  cursor: pointer; text-align: center; transition: all .15s;
  touch-action: manipulation; line-height: 1.3;
}
.seg-btn.sel-single    { border-color: var(--single);  background: #a78bfa22; color: var(--single); }
.seg-btn.sel-project   { border-color: var(--project); background: #f59e0b22; color: var(--project); }
.seg-btn.sel-recurring { border-color: var(--recur);   background: #34d39922; color: var(--recur); }
.seg-btn.sel-A { border-color: var(--a); background: #ff6b6b22; color: var(--a); }
.seg-btn.sel-B { border-color: var(--b); background: #ffd16622; color: var(--b); }
.seg-btn.sel-C { border-color: var(--c); background: #06d6a022; color: var(--c); }
.seg-btn.sel-D { border-color: var(--d); background: #4a9eff22; color: var(--d); }

.sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn {
  flex: 1; padding: 14px; border-radius: 12px; border: none;
  cursor: pointer; font-size: 15px;
  font-family: 'Noto Sans JP', sans-serif; font-weight: 500;
  transition: opacity .15s; touch-action: manipulation;
}
.btn:active { opacity: .75; }
.btn-primary { background: var(--accent); color: white; }
.btn-ghost { background: var(--surface2); color: var(--muted); }

.step-editor-row { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
.btn-del-step {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 20px; padding: 0 4px; line-height: 1;
  touch-action: manipulation;
}
.btn-add-step {
  width: 100%; padding: 10px; border-radius: 9px;
  border: 1px dashed var(--border); background: none; color: var(--muted);
  font-family: 'Noto Sans JP', sans-serif; font-size: 13px;
  cursor: pointer; transition: all .15s; touch-action: manipulation; margin-top: 4px;
}

.menu-item {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 4px; border-bottom: 1px solid var(--border);
  cursor: pointer; font-size: 15px; touch-action: manipulation;
}
.menu-item:last-child { border-bottom: none; }
.menu-item:active { opacity: .6; }
.menu-icon { font-size: 20px; width: 28px; text-align: center; }
.menu-item.danger { color: var(--a); }

.empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px; color: var(--muted); font-size: 13px; padding: 60px 0;
}
.empty-icon { font-size: 40px; opacity: .3; }

/* ログイン画面 */
.login-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px; background: var(--bg); z-index: 100;
  padding: 32px;
}
.login-screen.hidden { display: none; }
.login-title { font-size: 22px; font-weight: 500; }
.login-sub { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.7; }
.login-btn {
  padding: 14px 32px; border-radius: 12px;
  background: var(--accent); border: none; color: white;
  font-size: 15px; font-family: 'Noto Sans JP', sans-serif;
  font-weight: 500; cursor: pointer; touch-action: manipulation;
}
.login-btn:active { opacity: .8; }
</style>
</head>
<body>

<!-- ログイン画面 -->
<div class="login-screen" id="login-screen">
  <div class="login-title">タスク管理</div>
  <div class="login-sub">Googleアカウントでログインすると<br>タスクがドライブに自動保存されます</div>
  <button class="login-btn" onclick="signIn()">Googleでログイン</button>
</div>

<header class="header">
  <span class="header-title" id="header-label">すべてのタスク</span>
  <span class="sync-status" id="sync-status"></span>
  <button class="icon-btn" onclick="openMenu()">⋯</button>
</header>

<div class="filter-bar">
  <button class="chip active" id="chip-all" onclick="setFilter('all')">すべて<span class="chip-count" id="cnt-all">0</span></button>
  <button class="chip" id="chip-A" onclick="setFilter('A')"><span class="chip-dot" style="background:var(--a)"></span>A<span class="chip-count" id="cnt-A">0</span></button>
  <button class="chip" id="chip-B" onclick="setFilter('B')"><span class="chip-dot" style="background:var(--b)"></span>B<span class="chip-count" id="cnt-B">0</span></button>
  <button class="chip" id="chip-C" onclick="setFilter('C')"><span class="chip-dot" style="background:var(--c)"></span>C<span class="chip-count" id="cnt-C">0</span></button>
  <button class="chip" id="chip-D" onclick="setFilter('D')"><span class="chip-dot" style="background:var(--d)"></span>D<span class="chip-count" id="cnt-D">0</span></button>
  <button class="chip" id="chip-single" onclick="setFilter('single')"><span class="chip-dot" style="background:var(--single)"></span>単発<span class="chip-count" id="cnt-single">0</span></button>
  <button class="chip" id="chip-project" onclick="setFilter('project')"><span class="chip-dot" style="background:var(--project)"></span>PJ<span class="chip-count" id="cnt-project">0</span></button>
  <button class="chip" id="chip-recurring" onclick="setFilter('recurring')"><span class="chip-dot" style="background:var(--recur)"></span>定期<span class="chip-count" id="cnt-recurring">0</span></button>
  <button class="chip" id="chip-done" onclick="setFilter('done')"><span class="chip-dot" style="background:var(--border)"></span>完了<span class="chip-count" id="cnt-done">0</span></button>
</div>

<div class="task-list" id="task-list"></div>

<nav class="tabbar">
  <button class="tab-btn active" id="tab-tasks" onclick="setFilter('all')">
    <span class="tab-icon">☑</span>タスク
  </button>
  <button class="fab" onclick="openForm()">＋</button>
  <button class="tab-btn" id="tab-done-tab" onclick="setFilter('done')">
    <span class="tab-icon">✓</span>完了
  </button>
</nav>

<!-- FORM SHEET -->
<div class="sheet-overlay" id="form-overlay" onclick="closeForm()"></div>
<div class="sheet" id="form-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">タスクを追加</div>
  <div class="field-label">タスク名</div>
  <input class="f-input" id="f-title" placeholder="例：カモミールティーを買う" />
  <div class="field-label">種別</div>
  <div class="seg-group" id="seg-type">
    <button class="seg-btn sel-single" data-val="single" onclick="selectSeg('type','single')">単発</button>
    <button class="seg-btn" data-val="project" onclick="selectSeg('type','project')">プロジェクト</button>
    <button class="seg-btn" data-val="recurring" onclick="selectSeg('type','recurring')">定期</button>
  </div>
  <div class="field-label">優先度</div>
  <div class="seg-group" id="seg-priority">
    <button class="seg-btn" data-val="A" onclick="selectSeg('priority','A')">A<br><span style="font-size:10px;opacity:.7">緊急×重要</span></button>
    <button class="seg-btn sel-B" data-val="B" onclick="selectSeg('priority','B')">B<br><span style="font-size:10px;opacity:.7">重要</span></button>
    <button class="seg-btn" data-val="C" onclick="selectSeg('priority','C')">C<br><span style="font-size:10px;opacity:.7">緊急</span></button>
    <button class="seg-btn" data-val="D" onclick="selectSeg('priority','D')">D<br><span style="font-size:10px;opacity:.7">その他</span></button>
  </div>
  <div class="field-label">メモ（任意）</div>
  <textarea class="f-textarea" id="f-note" placeholder="補足など"></textarea>
  <div id="f-interval-wrap" style="display:none">
    <div class="field-label">繰り返し</div>
    <input class="f-input" id="f-interval" placeholder="例：毎週月曜、毎月1日" />
  </div>
  <div id="f-steps-wrap" style="display:none">
    <div class="field-label">ステップ</div>
    <div id="steps-editor"></div>
    <button class="btn-add-step" onclick="addStepInput()">＋ ステップを追加</button>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-ghost" onclick="closeForm()">キャンセル</button>
    <button class="btn btn-primary" onclick="submitTask()">追加する</button>
  </div>
</div>

<!-- MENU SHEET -->
<div class="sheet-overlay" id="menu-overlay" onclick="closeMenu()"></div>
<div class="sheet" id="menu-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">メニュー</div>
  <div class="menu-item" onclick="syncFromDrive(); closeMenu()">
    <span class="menu-icon">↓</span>ドライブから再読み込み
  </div>
  <div class="menu-item" onclick="forceSyncToDrive(); closeMenu()">
    <span class="menu-icon">↑</span>ドライブへ強制保存
  </div>
  <div class="menu-item" onclick="signOut(); closeMenu()">
    <span class="menu-icon">⏻</span>ログアウト
  </div>
</div>

<script>
const CLIENT_ID = '741303706363-kgdmf1pot1c86sv0poncpiehmcop81d9.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const FILE_NAME = 'tasks.json';
const LS_KEY = 'sasami_tasks_v2';
const LS_TOKEN = 'sasami_gtoken';

let tasks = [];
let accessToken = null;
let driveFileId = null;
let tokenClient = null;
let currentFilter = 'all';
let formType = 'single';
let formPriority = 'B';
let stepInputs = [];

// ══════════════════════
//   GOOGLE IDENTITY
// ══════════════════════
function initGIS() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: async (resp) => {
      if (resp.error) { setSyncStatus('err', 'ログイン失敗'); return; }
      accessToken = resp.access_token;
      localStorage.setItem(LS_TOKEN, accessToken);
      document.getElementById('login-screen').classList.add('hidden');
      await syncFromDrive();
    },
  });

  // 保存済みトークンがあれば自動でリストア試行
  const saved = localStorage.getItem(LS_TOKEN);
  if (saved) {
    accessToken = saved;
    document.getElementById('login-screen').classList.add('hidden');
    syncFromDrive().catch(() => {
      // トークン期限切れの場合はログイン画面へ
      accessToken = null;
      localStorage.removeItem(LS_TOKEN);
      document.getElementById('login-screen').classList.remove('hidden');
    });
  }
}

function signIn() {
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

function signOut() {
  if (accessToken) google.accounts.oauth2.revoke(accessToken);
  accessToken = null;
  localStorage.removeItem(LS_TOKEN);
  document.getElementById('login-screen').classList.remove('hidden');
}

// ══════════════════════
//   DRIVE API
// ══════════════════════
async function driveReq(method, path, params, body) {
  const url = new URL('https://www.googleapis.com' + path);
  if (params) Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  const opts = {
    method,
    headers: { Authorization: 'Bearer ' + accessToken },
  };
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  if (res.status === 401) throw new Error('401');
  return res;
}

async function findFile() {
  const res = await driveReq('GET', '/drive/v3/files', {
    spaces: 'appDataFolder',
    q: `name='${FILE_NAME}'`,
    fields: 'files(id)',
  });
  const data = await res.json();
  return data.files?.[0]?.id || null;
}

async function readFile(fileId) {
  const res = await driveReq('GET', `/drive/v3/files/${fileId}`, { alt: 'media' });
  return await res.json();
}

async function createFile(content) {
  // multipart upload
  const boundary = 'mytasks_boundary';
  const meta = JSON.stringify({ name: FILE_NAME, parents: ['appDataFolder'] });
  const body = `--${boundary}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(content)}\r\n--${boundary}--`;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: {
      Authorization: 'Bearer ' + accessToken,
      'Content-Type': `multipart/related; boundary=${boundary}`,
    },
    body,
  });
  const data = await res.json();
  return data.id;
}

async function updateFile(fileId, content) {
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: {
      Authorization: 'Bearer ' + accessToken,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(content),
  });
}

async function syncFromDrive() {
  setSyncStatus('busy', '読込中…');
  try {
    driveFileId = await findFile();
    if (driveFileId) {
      tasks = await readFile(driveFileId);
    } else {
      // 初回：ローカルのデータがあれば移行
      const local = localStorage.getItem(LS_KEY);
      tasks = local ? JSON.parse(local) : [];
      driveFileId = await createFile(tasks);
    }
    localStorage.setItem(LS_KEY, JSON.stringify(tasks));
    setSyncStatus('ok', '同期済み');
    render();
  } catch(e) {
    setSyncStatus('err', '同期失敗');
    // オフライン時はローカルキャッシュで動作
    const local = localStorage.getItem(LS_KEY);
    if (local) tasks = JSON.parse(local);
    render();
  }
}

async function saveToDrive() {
  localStorage.setItem(LS_KEY, JSON.stringify(tasks));
  if (!accessToken || !driveFileId) return;
  setSyncStatus('busy', '保存中…');
  try {
    await updateFile(driveFileId, tasks);
    setSyncStatus('ok', '保存済み');
  } catch {
    setSyncStatus('err', '保存失敗');
  }
}

async function forceSyncToDrive() {
  setSyncStatus('busy', '保存中…');
  try {
    if (!driveFileId) driveFileId = await findFile();
    if (driveFileId) {
      await updateFile(driveFileId, tasks);
    } else {
      driveFileId = await createFile(tasks);
    }
    setSyncStatus('ok', '保存済み');
  } catch {
    setSyncStatus('err', '保存失敗');
  }
}

function setSyncStatus(type, msg) {
  const el = document.getElementById('sync-status');
  el.className = 'sync-status ' + type;
  el.textContent = msg;
}

// ══════════════════════
//   FILTER
// ══════════════════════
const LABELS = {
  all:'すべてのタスク', A:'A ― 緊急×重要', B:'B ― 重要',
  C:'C ― 緊急', D:'D ― その他',
  single:'単発タスク', project:'プロジェクト', recurring:'定期タスク', done:'完了済み'
};

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  document.getElementById('chip-' + f)?.classList.add('active');
  document.getElementById('header-label').textContent = LABELS[f] || f;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (f === 'done') document.getElementById('tab-done-tab').classList.add('active');
  else document.getElementById('tab-tasks').classList.add('active');
  render();
}

function filteredTasks() {
  if (currentFilter === 'all')  return tasks.filter(t => !t.done);
  if (currentFilter === 'done') return tasks.filter(t => t.done);
  if ('ABCD'.includes(currentFilter)) return tasks.filter(t => !t.done && t.priority === currentFilter);
  return tasks.filter(t => !t.done && t.type === currentFilter);
}

// ══════════════════════
//   RENDER
// ══════════════════════
function updateCounts() {
  const active = tasks.filter(t => !t.done);
  document.getElementById('cnt-all').textContent = active.length;
  'ABCD'.split('').forEach(q => {
    document.getElementById('cnt-' + q).textContent = active.filter(t => t.priority === q).length;
  });
  ['single','project','recurring'].forEach(ty => {
    document.getElementById('cnt-' + ty).textContent = active.filter(t => t.type === ty).length;
  });
  document.getElementById('cnt-done').textContent = tasks.filter(t => t.done).length;
}

function render() {
  updateCounts();
  const list = document.getElementById('task-list');
  const items = filteredTasks();
  if (!items.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">◎</div><div>タスクなし</div></div>`;
    return;
  }
  list.innerHTML = items.map(taskCard).join('');
}

function taskCard(t) {
  const barCls   = 'bar-'   + t.priority.toLowerCase();
  const badgeCls = 'badge-' + t.priority.toLowerCase();
  const typeCls  = 'tag-'   + t.type;
  const typeLabel = { single:'単発', project:'プロジェクト', recurring:'定期' }[t.type];
  const doneClass  = t.done ? 'done' : '';
  const checkClass = t.done ? 'checked' : '';

  let extra = '';
  if (t.note) extra += `<div class="task-note">${esc(t.note)}</div>`;
  if (t.type === 'recurring' && t.interval)
    extra += `<div class="task-note" style="color:var(--recur)">↻ ${esc(t.interval)}</div>`;
  if (t.type === 'project' && t.steps?.length) {
    const done = t.steps.filter(s => s.done).length;
    const rows = t.steps.map((s, si) => `
      <div class="step-item" onclick="toggleStep('${t.id}',${si})">
        <div class="step-check ${s.done ? 'done-step' : ''}">${s.done ? '✓' : ''}</div>
        <span style="${s.done ? 'text-decoration:line-through;opacity:.5' : ''}">${esc(s.text)}</span>
      </div>`).join('');
    extra += `<div class="task-meta"><span class="steps-progress">${done}/${t.steps.length} 完了</span></div>
              <div class="steps-list">${rows}</div>`;
  }

  return `
    <div class="task-card ${doneClass}">
      <div class="quad-bar ${barCls}"></div>
      <div class="task-check ${checkClass}" onclick="toggleTask('${t.id}')"></div>
      <div class="task-body">
        <div class="task-title">${esc(t.title)}</div>
        <div class="task-meta">
          <span class="tag ${typeCls}">${typeLabel}</span>
          <span class="quad-badge ${badgeCls}">${t.priority}</span>
        </div>
        ${extra}
      </div>
      <button class="task-del" onclick="deleteTask('${t.id}')">×</button>
    </div>`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ══════════════════════
//   ACTIONS
// ══════════════════════
function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.done = !t.done;
  render(); saveToDrive();
}

function toggleStep(taskId, si) {
  const t = tasks.find(t => t.id === taskId);
  if (!t?.steps) return;
  t.steps[si].done = !t.steps[si].done;
  render(); saveToDrive();
}

function deleteTask(id) {
  if (!confirm('このタスクを削除しますか？')) return;
  tasks = tasks.filter(t => t.id !== id);
  render(); saveToDrive();
}

// ══════════════════════
//   FORM
// ══════════════════════
function openForm() {
  formType = 'single'; formPriority = 'B'; stepInputs = [];
  refreshSeg(); renderStepInputs();
  document.getElementById('f-title').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('f-interval').value = '';
  updateFormFields();
  document.getElementById('form-overlay').classList.add('open');
  document.getElementById('form-sheet').classList.add('open');
  setTimeout(() => document.getElementById('f-title').focus(), 300);
}

function closeForm() {
  document.getElementById('form-overlay').classList.remove('open');
  document.getElementById('form-sheet').classList.remove('open');
}

function selectSeg(axis, val) {
  if (axis === 'type')     { formType = val; updateFormFields(); }
  if (axis === 'priority') { formPriority = val; }
  refreshSeg();
}

function refreshSeg() {
  document.querySelectorAll('#seg-type .seg-btn').forEach(b => {
    b.className = 'seg-btn' + (b.dataset.val === formType ? ' sel-' + formType : '');
  });
  document.querySelectorAll('#seg-priority .seg-btn').forEach(b => {
    b.className = 'seg-btn' + (b.dataset.val === formPriority ? ' sel-' + formPriority : '');
  });
}

function updateFormFields() {
  document.getElementById('f-interval-wrap').style.display = formType === 'recurring' ? 'block' : 'none';
  document.getElementById('f-steps-wrap').style.display    = formType === 'project'   ? 'block' : 'none';
}

function addStepInput() { stepInputs.push(''); renderStepInputs(); }

function renderStepInputs() {
  document.getElementById('steps-editor').innerHTML = stepInputs.map((s, i) => `
    <div class="step-editor-row">
      <input class="f-input" value="${esc(s)}" oninput="stepInputs[${i}]=this.value"
        placeholder="ステップ ${i+1}" style="flex:1;font-size:14px;padding:10px 12px" />
      <button class="btn-del-step" onclick="removeStep(${i})">×</button>
    </div>`).join('');
}

function removeStep(i) { stepInputs.splice(i, 1); renderStepInputs(); }

function submitTask() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }
  const task = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2),
    title, type: formType, priority: formPriority,
    note: document.getElementById('f-note').value.trim() || null,
    interval: document.getElementById('f-interval').value.trim() || null,
    steps: formType === 'project'
      ? stepInputs.map(s => s.trim()).filter(Boolean).map(s => ({ text: s, done: false }))
      : [],
    done: false, createdAt: Date.now(),
  };
  tasks.unshift(task);
  closeForm(); setFilter('all'); saveToDrive();
}

// ══════════════════════
//   MENU
// ══════════════════════
function openMenu() {
  document.getElementById('menu-overlay').classList.add('open');
  document.getElementById('menu-sheet').classList.add('open');
}
function closeMenu() {
  document.getElementById('menu-overlay').classList.remove('open');
  document.getElementById('menu-sheet').classList.remove('open');
}

// ══════════════════════
//   KEYBOARD
// ══════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeForm(); closeMenu(); }
  if (e.key === 'Enter' && e.ctrlKey) submitTask();
});

// ══════════════════════
//   INIT
// ══════════════════════
window.onload = () => {
  // GISライブラリの読み込み完了を待つ
  const wait = setInterval(() => {
    if (window.google?.accounts?.oauth2) {
      clearInterval(wait);
      initGIS();
    }
  }, 100);
};
